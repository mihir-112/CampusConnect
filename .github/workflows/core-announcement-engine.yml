
name: Core Announcement Engine CI

on:
  push:
    branches:
      - feature/core-announcement-engine

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx2

      - name: Run Core Announcement Engine tests
        run: |
          python -m pytest -v features/core-announcement-engine/tests
