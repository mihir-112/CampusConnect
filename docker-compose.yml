services:
  backend:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      DATABASE_URL: sqlite:////data/campusconnect.db
      UPLOAD_DIR: /data/uploads
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-120}
    volumes:
      - campusconnect_data:/data
    ports:
      - "8000:8000"   # Swagger documentation at http://localhost:8000/docs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"     # The application: http://localhost:8080
    restart: unless-stopped

volumes:
  campusconnect_data:
